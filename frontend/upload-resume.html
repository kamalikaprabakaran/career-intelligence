<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Resume — Career Intelligence</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Shared Navbar is dynamically injected at top -->

    <div class="page-container">
        <!-- Alert if no profile active -->
        <div id="no-profile-alert" class="user-alert" style="display:none;">
            <strong>No user profile active.</strong> Please <a href="index.html">select or create a profile</a> to
            continue.
        </div>

        <div id="resume-content" style="display:none;">
            <div class="card">
                <h2
                    style="font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
                    Upload Your Resume
                </h2>

                <input type="file" id="resumeFileInput" accept="application/pdf" style="display:none">
                <div id="dropZone"
                    style="border: 2px dashed var(--border); padding: 40px; text-align: center; cursor: pointer; border-radius: 8px; background: rgba(255, 255, 255, 0.005); transition: border-color 0.2s ease, background-color 0.2s ease;">
                    <p style="margin: 0; font-size: 1.1rem; font-weight: 500;">Drag & drop your PDF here, or click to
                        browse</p>
                </div>

                <div id="selectedFileName"
                    style="margin-top: 12px; font-size: 0.95rem; color: var(--success); font-weight: 500;"></div>

                <button id="uploadBtn" disabled style="margin-top: 20px;">Extract Skills from Resume</button>

                <div id="uploadStatus" class="status-msg" style="margin-top: 16px; font-weight: 500; padding: 0;"></div>

                <!-- Display extracted skills as tags -->
                <div id="extractedSkillsDisplay" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;">
                </div>

                <!-- Apply skills button, initially hidden -->
                <button id="applySkillsBtn" style="display: none; background: var(--success); margin-top: 20px;">Apply
                    Skills to My Profile</button>
            </div>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script src="js/upload-resume.js"></script>
</body>

</html>
