<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Intelligence — Connection Test</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="page">
    <header>
      <h1>AI Career Intelligence</h1>
      <p>Phase 1 & 2 milestone: Frontend → FastAPI → Supabase</p>
    </header>

    <div class="card">
      <h2 id="db-status"><span class="status-dot"></span>Checking connection...</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 0;">
        This checks that your FastAPI backend is running and can reach your Supabase database.
      </p>
    </div>

    <div class="card">
      <h2>Create a test user</h2>
      <form id="user-form">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="e.g. Priya Sharma" />

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="e.g. priya@example.com" />

        <label for="education">Education</label>
        <input type="text" id="education" placeholder="e.g. B.Tech Computer Science" />

        <label for="target_role">Target Role</label>
        <input type="text" id="target_role" placeholder="e.g. AI Engineer" />

        <label for="experience">Experience</label>
        <input type="text" id="experience" placeholder="e.g. Fresher / 1 year" />

        <button type="submit" id="submit-btn">Create User</button>
      </form>
      <div id="result"></div>
    </div>

    <!-- My Skills Section, hidden by default until a user is created -->
    <div id="skills-section" class="card" style="display: none;">
      <div class="skills-header">
        <h2 style="margin: 0;">My Skills</h2>
        <button type="button" id="toggle-skill-form-btn">+ Add Skill</button>
      </div>

      <!-- Skill Entry Form, hidden by default -->
      <form id="skill-form" style="display: none; margin-top: 16px;">
        <label for="skill_name">Skill Name</label>
        <input type="text" id="skill_name" required placeholder="e.g. Python" />

        <label for="proficiency">Proficiency</label>
        <select id="proficiency" required>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>

        <label for="years_experience">Years of Experience</label>
        <input type="number" id="years_experience" min="0" step="0.1" required placeholder="e.g. 2" />

        <button type="submit" id="add-skill-submit-btn">Add Skill</button>
      </form>

      <div id="skill-result"></div>

      <ul id="skills-list" style="list-style: none; padding-left: 0; margin-top: 16px;">
        <!-- Dynamically populated -->
      </ul>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
