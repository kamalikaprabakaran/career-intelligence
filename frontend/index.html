<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Intelligence — Connect & Start</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <!-- We do NOT inject top navbar on index.html, since it serves as the Welcome / Getting Started Landing screen. -->

  <div class="page"
    style="flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 500px; padding: 40px 20px;">

    <!-- Hero / Intro -->
    <header style="text-align: center; margin-bottom: 32px;">
      <h1
        style="font-size: 2.2rem; margin: 0 0 10px 0; background: linear-gradient(135deg, #e6e8ec 30%, #4f8cff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        AI Career Intelligence
      </h1>
      <p style="font-size: 1.05rem; line-height: 1.5; color: var(--muted); margin: 0;">
        Bridge the gap between your capabilities and dream jobs using smart AI skill analysis.
      </p>
    </header>

    <!-- Connection Indicator -->
    <div class="card" style="padding: 16px; margin-top: 0; text-align: center;">
      <h2 id="db-status"
        style="font-size: 0.95rem; margin: 0; display: inline-flex; align-items: center; justify-content: center;">
        <span class="status-dot"></span>Checking connection...
      </h2>
    </div>

    <!-- Onboarding: Choose Existing Profile -->
    <div class="card" id="selector-card" style="display: none; margin-top: 16px;">
      <h2>Select Your Profile</h2>
      <label for="user-select">Choose your existing active profile:</label>
      <select id="user-select" style="margin-bottom: 12px;">
        <option value="" disabled selected>Loading profiles...</option>
      </select>
      <button type="button" id="start-btn">Get Started &rarr;</button>

      <p style="text-align: center; margin: 12px 0 0 0; font-size: 0.85rem;">
        <span style="color: var(--muted);">New applicant?</span>
        <a href="#" id="show-register-link" style="color: var(--accent); text-decoration: underline;">Create a
          profile</a>
      </p>
    </div>

    <!-- Onboarding: Create Profile Form -->
    <div class="card" id="register-card" style="margin-top: 16px;">
      <h2>Create Your Profile</h2>
      <form id="user-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="e.g. Priya Sharma" />

        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="e.g. priya@example.com" />

        <label for="target_role">Target Role</label>
        <input type="text" id="target_role" placeholder="e.g. AI Engineer" />

        <label for="education">Highest Education</label>
        <input type="text" id="education" placeholder="e.g. B.Tech Computer Science" />

        <label for="experience">Experience Level</label>
        <input type="text" id="experience" placeholder="e.g. Fresher / 2 years" />

        <button type="submit" id="submit-btn">Create & Get Started</button>
      </form>

      <div id="result" class="status-msg" style="margin-top: 14px; border-radius: 6px;"></div>

      <p style="text-align: center; margin: 16px 0 0 0; font-size: 0.85rem;">
        <span style="color: var(--muted);">Already registered?</span>
        <a href="#" id="show-select-link" style="color: var(--accent); text-decoration: underline;">Select existing
          profile</a>
      </p>
    </div>

  </div>

  <script src="js/navigation.js"></script>
  <script src="js/landing.js"></script>
</body>

</html>
