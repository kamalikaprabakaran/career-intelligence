<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recommendations — Career Intelligence</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Shared Navbar is dynamically injected at top -->

    <div class="page-container">
        <header class="card"
            style="margin-bottom: 24px; margin-top: 0; padding: 24px; box-sizing: border-box; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <h2 id="active-profile-name" style="margin: 0 0 8px 0; font-size: 1.5rem; font-weight: 700;">Loading
                    active profile...</h2>
                <button
                    onclick="document.getElementById('minimal-user-switcher').style.display='block'; this.style.display='none';"
                    style="font-size: 0.9rem; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline;">Switch
                    profile</button>
            </div>
            <p style="margin-bottom: 8px;">Find matching roles based on your verified skills.</p>

            <div id="minimal-user-switcher"
                style="display: none; margin-bottom: 24px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px dashed var(--border);">
                <label for="user-select" style="font-size: 0.85rem; color: var(--muted); margin-right: 8px;">Select
                    User:</label>
                <select id="user-select"
                    style="padding: 6px 12px; border-radius: 6px; background: var(--surface); color: var(--text); border: 1px solid var(--border); min-width: 250px;">
                    <option value="" disabled selected>Loading profiles...</option>
                </select>
            </div>
        </header>

        <!-- Alert shown if no profile is selected -->
        <div id="no-profile-alert" class="user-alert">
            <strong>No user profile selected yet!</strong> Select an existing profile above or
            <a href="index.html">create a new one here</a>.
        </div>

        <!-- Recommendations Section -->
        <div id="recommendations-section" style="display: none;">
            <h2 style="margin-top: 32px; font-size: 1.2rem;">Matched Recommendations</h2>
            <div id="recommendations-container" class="recs-grid">
                <!-- Recommendations will be loaded dynamically here -->
            </div>
        </div>
    </div>

    <script src="js/navigation.js?v=2"></script>
    <script src="js/recommendations.js?v=2"></script>
</body>

</html>
