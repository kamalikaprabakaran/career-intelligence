<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recommendations — Career Intelligence</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Shared Navbar is dynamically injected at top -->

    <div class="page">
        <header style="margin-bottom: 24px;">
            <h1>Job Recommendations</h1>
            <p>Find matching roles based on your verified skills</p>
        </header>

        <!-- User Selector -->
        <div class="card">
            <h2>Select User Profile</h2>
            <label for="user-select">Choose a user to view personalized job recommendations:</label>
            <select id="user-select">
                <option value="" disabled selected>Loading profiles...</option>
            </select>
        </div>

        <!-- Alert shown if no profile is selected -->
        <div id="no-profile-alert" class="user-alert">
            <strong>No user profile selected yet!</strong> Select an existing profile above or
            <a href="index.html">create a new one here</a>.
        </div>

        <!-- Recommendations Section -->
        <div id="recommendations-section" style="display: none;">
            <h2 style="margin-top: 32px; font-size: 1.2rem;">Matched Recommendations</h2>
            <div id="recommendations-container">
                <!-- Recommendations will be loaded dynamically here -->
            </div>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script src="js/recommendations.js"></script>
</body>

</html>
