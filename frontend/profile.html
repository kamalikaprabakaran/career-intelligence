<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile — Career Intelligence</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Shared Navbar is dynamically injected at top -->

    <div class="page-container">

        <!-- Alert shown if no profile is active (e.g. after logout, before session set) -->
        <div id="no-profile-alert" class="user-alert" style="display:none;">
            <strong>No user profile active.</strong> Please <a href="index.html">select or create a profile</a> to
            continue.
        </div>

        <!-- Main Profile details -->
        <div id="profile-content" style="display: none;">

            <!-- 1. Header Row -->
            <div class="card" style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div id="prof-avatar"
                        style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #4f8cff, #3075f2); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; color: white;">
                        --
                    </div>
                    <div>
                        <div style="font-size: 1.8rem; font-weight: 700; color: var(--text);" id="prof-name">-</div>
                        <div style="font-size: 1rem; color: var(--accent); font-weight: 500; margin-top: 4px;"
                            id="prof-role">-</div>
                        <div style="font-size: 0.9rem; color: var(--muted); margin-top: 4px;" id="prof-loc">Location:
                            Not specified</div>
                    </div>
                </div>
                <button type="button" style="width: auto; padding: 10px 20px;" class="btn-secondary">Edit
                    Profile</button>
            </div>

            <!-- 2. Professional Information -->
            <div class="card">
                <h2
                    style="font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
                    Professional Information</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;">
                    <div>
                        <div style="font-size: 0.85rem; color: var(--muted); text-transform: uppercase;">Education</div>
                        <div style="font-size: 1.05rem; font-weight: 500; margin-top: 4px;" id="prof-edu">-</div>
                    </div>
                    <div>
                        <div style="font-size: 0.85rem; color: var(--muted); text-transform: uppercase;">Experience
                        </div>
                        <div style="font-size: 1.05rem; font-weight: 500; margin-top: 4px;" id="prof-exp">-</div>
                    </div>
                    <div>
                        <div style="font-size: 0.85rem; color: var(--muted); text-transform: uppercase;">Status</div>
                        <div style="font-size: 1.05rem; font-weight: 500; margin-top: 4px; color: var(--success);">Open
                            to opportunities</div>
                    </div>
                </div>
            </div>

            <!-- 3. My Skills -->
            <div class="card" id="skills-section">
                <div class="skills-header"
                    style="border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
                    <h2 style="margin: 0;" id="skills-count-header">My Skills</h2>
                    <button type="button" id="toggle-skill-form-btn">+ Add Skill</button>
                </div>

                <!-- Add Skill Form (hidden by default) -->
                <form id="skill-form" style="display: none; margin-bottom: 16px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                        <div>
                            <label for="skill_name">Skill Name</label>
                            <input type="text" id="skill_name" required placeholder="e.g. Python" />
                        </div>
                        <div>
                            <label for="proficiency">Proficiency</label>
                            <select id="proficiency" required>
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>
                        </div>
                        <div>
                            <label for="years_experience">Years of Experience</label>
                            <input type="number" id="years_experience" min="0" step="0.1" required
                                placeholder="e.g. 2" />
                        </div>
                    </div>
                    <button type="submit" id="add-skill-submit-btn" style="width: auto;">Submit Skill</button>
                </form>

                <div id="skill-result"></div>

                <div id="skills-list" class="skills-grid"
                    style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <!-- 4. Resume Upload Link -->
            <div class="card" id="resume-content">
                <h2
                    style="font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
                    Resume</h2>
                <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 16px;">Upload your latest resume to
                    automatically extract
                    and apply skills.</p>

                <a href="upload-resume.html"
                    style="text-decoration: none; display: inline-block; padding: 10px 20px; border-radius: 8px; background: linear-gradient(135deg, #4f8cff, #3075f2); color: white; font-weight: 600;">Go
                    to Resume Upload</a>
            </div>

        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
