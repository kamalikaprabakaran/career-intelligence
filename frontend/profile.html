<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile — Career Intelligence</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Shared Navbar is dynamically injected at top -->

    <div class="page">
        <header style="margin-bottom: 24px;">
            <h1>My Profile</h1>
            <p>Manage your professional background and skill inventory</p>
        </header>

        <!-- User Selector -->
        <div class="card">
            <h2>Select Profile</h2>
            <label for="user-select">Choose your active profile:</label>
            <select id="user-select">
                <option value="" disabled selected>Loading profiles...</option>
            </select>
        </div>

        <!-- Alert shown if no profile is selected -->
        <div id="no-profile-alert" class="user-alert">
            <strong>No user profile selected yet!</strong> Select an existing profile above or
            <a href="index.html">create a new one here</a>.
        </div>

        <!-- Main Profile details -->
        <div id="profile-content" style="display: none;">
            <!-- Profile Information -->
            <div class="card">
                <h2>Professional Info</h2>
                <div style="margin-top: 16px;">
                    <div style="font-size: 1.15rem; font-weight:600; color: var(--text);" id="prof-name">-</div>
                    <div style="font-size: 0.9rem; color: var(--accent); margin: 4px 0 12px 0;" id="prof-role">-</div>
                    <p style="margin: 6px 0; font-size: 0.9rem; color: var(--muted);"><strong>Email:</strong> <span
                            id="prof-email" style="color: var(--text);">-</span></p>
                    <p style="margin: 6px 0; font-size: 0.9rem; color: var(--muted);"><strong>Education:</strong> <span
                            id="prof-edu" style="color: var(--text);">-</span></p>
                    <p style="margin: 6px 0; font-size: 0.9rem; color: var(--muted);"><strong>Experience:</strong> <span
                            id="prof-exp" style="color: var(--text);">-</span></p>
                </div>
            </div>

            <!-- User Skills List -->
            <div class="card" id="skills-section">
                <div class="skills-header">
                    <h2 style="margin: 0;">My Skills</h2>
                    <button type="button" id="toggle-skill-form-btn">+ Add Skill</button>
                </div>

                <!-- Add Skill Form (hidden by default) -->
                <form id="skill-form" style="display: none; margin-top: 16px;">
                    <label for="skill_name">Skill Name</label>
                    <input type="text" id="skill_name" required placeholder="e.g. Python" />

                    <label for="proficiency">Proficiency</label>
                    <select id="proficiency" required>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>

                    <label for="years_experience">Years of Experience</label>
                    <input type="number" id="years_experience" min="0" step="0.1" required placeholder="e.g. 2" />

                    <button type="submit" id="add-skill-submit-btn">Add Skill</button>
                </form>

                <div id="skill-result"></div>

                <ul id="skills-list" style="list-style: none; padding-left: 0; margin-top: 16px;">
                    <!-- Dynamically populated -->
                </ul>
            </div>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
